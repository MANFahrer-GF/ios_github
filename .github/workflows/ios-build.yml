name: iOS-Build

on:
  push:
    branches: [ "**" ]
    paths-ignore: [ "docs/**", "web/**", "**/*.md" ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Linux statt macOS: TonneCore läuft auf beiden, Linux-Minuten sind deutlich günstiger.
  core-tests:
    name: TonneCore-Tests
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Tests
        working-directory: TonneCore
        run: swift test

  app-build:
    name: App, Widgets und Watch bauen (${{ matrix.xcode }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Bei jedem Push nur Xcode 27 (macOS-Minuten zählen zehnfach); Xcode 26 zusätzlich beim manuellen Start.
      matrix:
        include: ${{ fromJSON(github.event_name == 'workflow_dispatch'
          && '[{"runner":"xcode-27","xcode":"Xcode 27","pattern":"Xcode_27"},{"runner":"macos-15","xcode":"Xcode 26","pattern":"Xcode_26"}]'
          || '[{"runner":"xcode-27","xcode":"Xcode 27","pattern":"Xcode_27"}]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: |
          echo "Installiert:"; ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/${{ matrix.pattern }}*.app 2>/dev/null | sort -V | tail -1)"
          # Images mit nur einer Xcode-Version haben teils nur /Applications/Xcode.app
          if [ -z "$XCODE" ] && /Applications/Xcode.app/Contents/Developer/usr/bin/xcodebuild -version 2>/dev/null | grep -q "^${{ matrix.xcode }}"; then XCODE=/Applications/Xcode.app; fi
          if [ -z "$XCODE" ]; then echo "::error::${{ matrix.xcode }} ist auf ${{ matrix.runner }} nicht installiert"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TonneUndTorte.xcodeproj \
            -scheme "Tonne & Torte" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Warnungen zusammenfassen
        if: always()
        run: |
          echo "## Warnungen (${{ matrix.xcode }})" >> "$GITHUB_STEP_SUMMARY"
          grep -E "warning:" build.log | grep -v "/DerivedData/" | sed -E 's#^.*/ios_github/##' | sort -u | head -80 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "warning:" build.log | grep -v "/DerivedData/" | sed -E 's#^.*/ios_github/##' | sort -u | head -80 || true
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          echo "## Compilerfehler" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -60 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "error:" build.log | sort -u | head -60
      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.runner }}
          path: build.log

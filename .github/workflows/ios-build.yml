name: iOS-Build

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: TonneCore-Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
      - name: Tests
        working-directory: TonneCore
        run: swift test

  app-build:
    name: App, Widgets und Watch bauen
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)"
          xcodebuild -version
      - name: Bauen (Simulator, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild build \
            -project TonneUndTorte.xcodeproj \
            -scheme "Tonne & Torte" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Fehler zusammenfassen
        if: failure()
        run: |
          echo "## Compilerfehler" >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:" build.log | sort -u | head -60 | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
          grep -E "error:" build.log | sort -u | head -60
      - name: Build-Log sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
